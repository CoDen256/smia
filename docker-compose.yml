services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smia
      POSTGRES_PASSWORD: smia
      POSTGRES_DB: smia
    ports:
      - "5433:5432"   # published for local dev (native venv connecting in); drop for a locked-down deploy
    volumes:
      - smia-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smia"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://smia:smia@postgres:5432/smia
      SMIA_AUTH_TOKEN: ${SMIA_AUTH_TOKEN:-changeme}
      FLASK_DEBUG: "0"
      # Provider credentials (D-T2): passed through with empty defaults, not
      # required — a provider whose token is empty just fails at adapter-call
      # time with its existing "needs a *_TOKEN" error; compose itself never
      # refuses to start over a missing provider key. See .env.example.
      HF_TOKEN: ${HF_TOKEN:-}
      DEEPL_TOKEN: ${DEEPL_TOKEN:-}
      ELEVENLABS_TOKEN: ${ELEVENLABS_TOKEN:-}
    volumes:
      # Bind mount, not baked into the image: providers/ is gitignored raw
      # data (hundreds of MB to ~1GB), not something to COPY into every
      # built image layer. bootstrap.py imports from here once, idempotently
      # (skipped on restart once the named Postgres volume is populated),
      # and warns-but-doesn't-fail if a given file isn't present.
      - ./providers:/app/providers:ro
    ports:
      - "5055:5055"
    networks:
      # default: this project's own network, unchanged.
      # tun-shared: lets stabbur's backend reach this container for the
      # smia-enrichment-panel proxy (SMIA_BASE_URL). Aliased to
      # "smia-backend" rather than this service's own name ("backend") —
      # stabbur's own backend service is *also* named "backend", and the
      # two would collide on the shared network otherwise (the same
      # per-project-name collision stabbur's D94 renamed its postgres
      # service to avoid). One-time setup: `docker network create
      # tun-shared` before bringing any of these stacks up.
      default: {}
      tun-shared:
        aliases:
          - smia-backend

networks:
  default: {}
  tun-shared:
    external: true

volumes:
  smia-pg-data:
